# Preflight gate for oxpulse-core (public repo → free ubuntu-24.04-arm).
#
# Runs on every PR to main and every push to main.
# Gate: pnpm install → typecheck → vitest (all packages) → build.
# Tests run with --no-file-parallelism (WebCrypto state isolation, see
# transport-crypto.test.ts).
#
# Per ci-setup skill: public repo → ubuntu-24.04-arm (free unlimited,
# arm64 = prod-box parity). No self-hosted runner needed.

name: preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          docs_only=false
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do is_doc "$f" || { docs_only=false; why="code path: $f"; break; }; done <<<"$list"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" >> "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Do NOT pass `version` — packageManager in package.json (pnpm@10.28.2)
        # is auto-detected by the action. Passing both is a hard error.

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build BEFORE typecheck. packages/mesh-core imports @oxpulse/identity,
      # which is now linked from the workspace (pnpm-workspace.yaml,
      # linkWorkspacePackages) rather than downloaded from npm. The registry
      # tarball ships a built dist/ with .d.ts files; the workspace checkout
      # does not until it is compiled. Typechecking first therefore fails with
      # "Cannot find module '@oxpulse/identity'". `pnpm -r run build` walks the
      # workspace graph, so identity compiles before mesh-core.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (vitest, --no-file-parallelism)
        run: pnpm -r run test -- --run --no-file-parallelism
        env:
          # WebCrypto + fake-indexeddb need Node, not jsdom
          NODE_ENV: test
